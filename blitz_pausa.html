<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blitz - Pausa</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<style>

:root{--pink:#ff2d95;--violet:#7a35ff;--cyan:#22e5ff;--ink:#07030f;--white:#fff4fb;--glass:rgba(20,8,40,.62)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:var(--ink);overflow:hidden}
#stage{
  position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;background:var(--ink);
  transform-origin:0 0;font-family:'Rajdhani','Segoe UI',sans-serif;color:var(--white);
  -webkit-font-smoothing:antialiased;
}
@property --a{syntax:'<angle>';inherits:false;initial-value:0deg}
@property --b{syntax:'<angle>';inherits:false;initial-value:0deg}
@keyframes spin{to{--a:360deg}}
@keyframes spinb{to{--b:360deg}}
@keyframes rot{to{transform:rotate(360deg)}}
@keyframes blink{50%{opacity:.25}}

/* ---------- Fondo ---------- */
.bg{position:absolute;inset:0;overflow:hidden;background:var(--ink)}
.bg .mesh{
  position:absolute;inset:-300px;
  background:
    radial-gradient(900px 560px at 12% 0%, rgba(122,53,255,.50), transparent 70%),
    radial-gradient(800px 520px at 100% 100%, rgba(255,45,149,.42), transparent 70%),
    radial-gradient(700px 480px at 50% 50%, rgba(34,229,255,.12), transparent 70%);
  animation:mesh 18s ease-in-out infinite alternate;
}
@keyframes mesh{from{transform:translate3d(-40px,-20px,0) scale(1)}to{transform:translate3d(60px,30px,0) scale(1.08)}}
.bg .stripes{
  position:absolute;inset:-200px;
  background:repeating-linear-gradient(115deg, rgba(255,45,149,.06) 0 2px, transparent 2px 46px);
  animation:drift 14s linear infinite;
}
@keyframes drift{to{transform:translateX(92px)}}
.bg .grid{
  position:absolute;inset:0;opacity:.55;
  background-image:
    linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
  background-size:60px 60px;
  -webkit-mask:radial-gradient(ellipse at center, transparent 20%, #000 100%);
          mask:radial-gradient(ellipse at center, transparent 20%, #000 100%);
}
.bg .beam{position:absolute;width:1700px;height:1700px;mix-blend-mode:screen;will-change:transform}
.bg .beam.a{left:-850px;top:-850px;background:conic-gradient(from 0deg, transparent 0 86%, rgba(255,45,149,.22) 93%, transparent 100%);animation:rot 15s linear infinite}
.bg .beam.b{left:1070px;top:230px;background:conic-gradient(from 180deg, transparent 0 86%, rgba(34,229,255,.18) 93%, transparent 100%);animation:rot 19s linear infinite reverse}
.bg .scanbar{
  position:absolute;left:0;right:0;top:-160px;height:160px;
  background:linear-gradient(180deg,transparent,rgba(255,255,255,.04),rgba(34,229,255,.12),transparent);
  animation:scanbar 9s linear infinite;
}
@keyframes scanbar{to{transform:translateY(1400px)}}
.bg .scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg, rgba(0,0,0,.16) 0 1px, transparent 1px 3px);mix-blend-mode:multiply}
.bg .vig{position:absolute;inset:0;background:radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,.6) 100%)}
#sparks,#fx,#fw{position:absolute;left:0;top:0;width:1920px;height:1080px;pointer-events:none}

/* ---------- Marco de pantalla completa ---------- */
.sframe{position:absolute;left:24px;top:24px;width:1872px;height:1032px;pointer-events:none}
.sframe::before{
  content:"";position:absolute;inset:0;border-radius:6px;
  box-shadow:0 0 34px 2px rgba(255,45,149,.45), 0 0 70px 6px rgba(122,53,255,.28);
  animation:breathe 4s ease-in-out infinite alternate;
}
@keyframes breathe{from{opacity:.45}to{opacity:1}}
.sframe .edge{
  position:absolute;inset:0;border-radius:6px;padding:4px;
  background:conic-gradient(from var(--a,0deg), var(--pink), var(--violet), var(--cyan), var(--violet), var(--pink));
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
  animation:spin 6s linear infinite;
}
.sframe .edge::after{
  content:"";position:absolute;inset:0;border-radius:6px;
  background:conic-gradient(from var(--b,0deg), transparent 0 80%, rgba(255,255,255,0) 82%, rgba(255,255,255,.95) 97%, transparent 100%);
  animation:spinb 3.6s linear infinite;
}
.sframe .corner{position:absolute;width:56px;height:56px;border:5px solid var(--white);filter:drop-shadow(0 0 8px var(--cyan));animation:cpulse 2.4s ease-in-out infinite}
@keyframes cpulse{0%,100%{opacity:1}50%{opacity:.5}}
.sframe .tl{left:-10px;top:-10px;border-right:0;border-bottom:0}
.sframe .tr{right:-10px;top:-10px;border-left:0;border-bottom:0;animation-delay:-.6s}
.sframe .bl{left:-10px;bottom:-10px;border-right:0;border-top:0;animation-delay:-1.2s}
.sframe .br{right:-10px;bottom:-10px;border-left:0;border-top:0;animation-delay:-1.8s}

/* ---------- HUD superior ---------- */
.hud{position:absolute;left:64px;top:50px;width:1792px;height:72px;display:flex;align-items:center;gap:28px;z-index:5}
.logo{display:flex;align-items:center;gap:10px}
.logo svg{width:46px;height:56px;filter:drop-shadow(0 0 12px var(--pink));animation:flicker 5s infinite}
@keyframes flicker{0%,93%,100%{opacity:1}94%{opacity:.55}95%{opacity:1}97%{opacity:.7}}
.logo .word{
  font-family:'Anton','Impact',sans-serif;font-size:60px;line-height:1;letter-spacing:4px;transform:skewX(-10deg);
  background:
    linear-gradient(100deg,transparent 42%,rgba(255,255,255,.95) 50%,transparent 58%) 150% 0/250% 100% no-repeat,
    linear-gradient(180deg,#fff 8%,#ffc4e3 45%,var(--pink) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 14px rgba(255,45,149,.65)) drop-shadow(0 3px 0 rgba(0,0,0,.35));
  animation:shine 6s ease-in-out infinite;
}
@keyframes shine{0%,55%{background-position:150% 0,0 0}100%{background-position:-60% 0,0 0}}
.state{
  position:relative;display:flex;align-items:center;gap:10px;padding:7px 20px;border-radius:4px;overflow:hidden;
  background:linear-gradient(135deg,#ff4aa8,var(--pink) 55%,#d10f73);
  font-weight:700;font-size:24px;letter-spacing:3px;transform:skewX(-10deg);
  box-shadow:0 0 18px rgba(255,45,149,.6), inset 0 1px 0 rgba(255,255,255,.45);
}
.state.alt{background:linear-gradient(135deg,#a273ff,var(--violet) 55%,#4a16c4);box-shadow:0 0 18px rgba(122,53,255,.7), inset 0 1px 0 rgba(255,255,255,.45)}
.state::after{content:"";position:absolute;top:0;bottom:0;width:40px;left:-60px;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);animation:livesheen 3.4s ease-in-out infinite}
@keyframes livesheen{0%,60%{left:-60px}100%{left:140%}}
.state i{position:relative;width:12px;height:12px;border-radius:50%;background:#fff}
.state i::after{content:"";position:absolute;inset:0;border-radius:50%;background:#fff;animation:ping 1.6s ease-out infinite}
@keyframes ping{0%{transform:scale(1);opacity:.8}100%{transform:scale(3.2);opacity:0}}
.clock{
  margin-left:auto;display:flex;align-items:center;gap:10px;height:46px;padding:0 18px;border-radius:4px;
  background:var(--glass);border:1px solid rgba(255,255,255,.14);
  font-family:'Anton','Impact',sans-serif;font-size:28px;letter-spacing:3px;box-shadow:inset 0 1px 0 rgba(255,255,255,.12);
}
.clock::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--cyan);box-shadow:0 0 10px var(--cyan);animation:blink 1s infinite}

/* ---------- Ticker inferior ---------- */
.ticker{
  position:absolute;left:64px;top:984px;width:1792px;height:46px;overflow:hidden;border-radius:3px;z-index:5;
  background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,0));
  border-top:2px solid rgba(255,255,255,.2);border-bottom:2px solid rgba(255,45,149,.45);
  -webkit-mask:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);
          mask:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);
}
.ticker::after{content:"";position:absolute;top:0;bottom:0;width:120px;left:-160px;background:linear-gradient(100deg,transparent,rgba(34,229,255,.28),transparent);transform:skewX(-20deg);animation:tsheen 5s ease-in-out infinite}
@keyframes tsheen{0%,45%{left:-160px}100%{left:110%}}
.ticker .track{position:absolute;white-space:nowrap;line-height:42px;font-size:25px;font-weight:700;letter-spacing:3px;animation:marquee 32s linear infinite}
.ticker b{color:var(--cyan);margin:0 26px;text-shadow:0 0 10px var(--cyan)}
@keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* ---------- Utilidades de efectos ---------- */
.center{position:absolute;left:0;top:130px;width:1920px;height:830px;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:3}
.ch{display:inline-block;white-space:pre;animation:chIn .6s cubic-bezier(.2,.9,.3,1) backwards;animation-delay:calc(var(--i) * var(--st,24ms) + var(--d,0ms))}
@keyframes chIn{0%{opacity:0;transform:translateY(40px) scale(.7);filter:blur(7px)}100%{opacity:1;transform:none;filter:none}}
.flash{
  position:absolute;inset:0;pointer-events:none;opacity:0;z-index:20;
  background:radial-gradient(900px 600px at 50% 30%, rgba(255,255,255,.85), rgba(255,45,149,.3) 45%, transparent 72%);
}
.flash.go{animation:flash .9s ease-out}
@keyframes flash{0%{opacity:0}8%{opacity:1}16%{opacity:.2}26%{opacity:.9}100%{opacity:0}}
#fx{z-index:21}
.shock{
  position:absolute;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;pointer-events:none;z-index:4;
  border:4px solid #fff;box-shadow:0 0 30px var(--pink),inset 0 0 30px var(--pink);animation:shock 1.1s ease-out forwards;
}
@keyframes shock{from{opacity:.95;transform:scale(.2)}to{opacity:0;transform:scale(14)}}

.center{gap:22px}
.glitch{position:relative;font-family:'Anton','Impact',sans-serif;font-size:130px;line-height:1.1;letter-spacing:8px;transform:skewX(-8deg);white-space:nowrap;animation:tin 1s cubic-bezier(.2,.9,.3,1) .1s backwards}
@keyframes tin{from{opacity:0;transform:skewX(-8deg) translateY(-60px) scale(1.2);filter:blur(12px)}to{opacity:1;transform:skewX(-8deg);filter:none}}
.glitch .gt{
  display:block;background:linear-gradient(180deg,#fff 8%,#ffc4e3 45%,var(--pink) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 22px rgba(255,45,149,.6)) drop-shadow(0 5px 0 rgba(0,0,0,.35));
}
.glitch::before,.glitch::after{content:attr(data-text);position:absolute;left:0;top:0;width:100%;overflow:hidden;text-align:center;clip-path:inset(0 0 100% 0)}
.glitch::before{color:var(--cyan);animation:gl1 3.2s infinite steps(1)}
.glitch::after{color:var(--pink);animation:gl2 3.2s 1.1s infinite steps(1)}
@keyframes gl1{0%,88%{clip-path:inset(0 0 100% 0);transform:none}89%{clip-path:inset(10% 0 62% 0);transform:translate(-12px,0)}91%{clip-path:inset(58% 0 18% 0);transform:translate(10px,0)}93%{clip-path:inset(30% 0 44% 0);transform:translate(-6px,0)}95%,100%{clip-path:inset(0 0 100% 0)}}
@keyframes gl2{0%,86%{clip-path:inset(0 0 100% 0);transform:none}87%{clip-path:inset(40% 0 38% 0);transform:translate(12px,0)}90%{clip-path:inset(5% 0 80% 0);transform:translate(-9px,0)}93%{clip-path:inset(70% 0 8% 0);transform:translate(7px,0)}96%,100%{clip-path:inset(0 0 100% 0)}}
.pwrap{position:relative;width:440px;height:440px;animation:cwin 1.1s cubic-bezier(.2,.9,.3,1) .35s backwards}
@keyframes cwin{from{opacity:0;transform:scale(.6) rotate(25deg);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}
.pwrap>svg{position:absolute;inset:0;width:440px;height:440px;overflow:visible}
.pwrap .spin{transform-box:fill-box;transform-origin:center;animation:rot 36s linear infinite}
.pwrap .spin.rev{animation-duration:22s;animation-direction:reverse}
.pwrap .spin.fast{animation-duration:9s}
.pwrap .core{transform-box:fill-box;transform-origin:center;animation:corep 2.6s ease-in-out infinite}
@keyframes corep{0%,100%{transform:scale(.94);opacity:.6}50%{transform:scale(1.05);opacity:1}}
.inside{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.pbars{display:flex;gap:12px;margin-bottom:6px;animation:pbp 1.8s ease-in-out infinite}
.pbars i{width:30px;height:96px;transform:skewX(-10deg);border-radius:3px;background:linear-gradient(180deg,#fff,var(--cyan));box-shadow:0 0 22px var(--cyan)}
@keyframes pbp{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.12);opacity:1}}
.label{font-weight:700;font-size:30px;letter-spacing:9px;line-height:1.2;text-align:center;color:rgba(255,255,255,.8);white-space:nowrap;text-shadow:0 0 14px rgba(34,229,255,.5)}
.msg{font-size:40px;font-weight:700;letter-spacing:2px;height:58px;line-height:58px;text-shadow:0 2px 12px rgba(0,0,0,.5);white-space:nowrap}
.eqbig{position:absolute;left:64px;top:924px;width:1792px;height:56px;display:flex;align-items:flex-end;gap:6px;z-index:2;
  -webkit-mask:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);mask:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.eqbig i{flex:1;min-width:4px;height:6px;border-radius:2px 2px 0 0;background:linear-gradient(180deg,var(--cyan),var(--violet) 55%,var(--pink));opacity:.9;animation:eqb var(--s,1s) ease-in-out infinite;animation-delay:var(--dl,0s)}
@keyframes eqb{0%,100%{height:6px}50%{height:var(--h,50px)}}
.hint{position:absolute;top:200px;height:700px;width:70px;z-index:3;display:flex;align-items:center;justify-content:center}
.hint span{writing-mode:vertical-rl;font-family:'Anton','Impact',sans-serif;font-size:34px;letter-spacing:16px;color:transparent;-webkit-text-stroke:1.5px rgba(255,255,255,.3)}
.hint.l{left:84px}.hint.r{right:84px}.hint.r span{transform:rotate(180deg)}

</style>
</head>
<body>

<div id="stage">
  <div class="bg">
    <div class="mesh"></div><div class="stripes"></div><div class="grid"></div>
    <div class="beam a"></div><div class="beam b"></div>
    <canvas id="sparks" width="1920" height="1080"></canvas>
    <div class="scanbar"></div><div class="scan"></div><div class="vig"></div>
  </div>
  
  <div class="sframe"><div class="edge"></div><i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i></div>

  <div class="hud">
    <div class="logo">
      <svg viewBox="0 0 46 56"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".5" stop-color="#ffb3dc"/><stop offset="1" stop-color="#ff2d95"/></linearGradient></defs>
        <path d="M28 0 L4 32 H20 L14 56 L42 20 H25 Z" fill="url(#g)"/></svg>
      <span class="word">BLITZ</span>
    </div>
    <div class="state alt"><i></i>EN PAUSA</div>
    <div class="clock" id="clock">--:--</div>
  </div>

  <div class="hint l"><span>BRB · BRB · BRB</span></div>
  <div class="hint r"><span>BRB · BRB · BRB</span></div>
  <div class="center">
    <div class="glitch" id="title" data-text=""><span class="gt" id="titletxt"></span></div>
    <div class="pwrap" id="pw">
      <svg viewBox="0 0 480 480">
        <defs><linearGradient id="gp" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22e5ff"/><stop offset=".5" stop-color="#7a35ff"/><stop offset="1" stop-color="#ff2d95"/></linearGradient>
          <radialGradient id="core"><stop offset="0" stop-color="rgba(122,53,255,.45)"/><stop offset="1" stop-color="rgba(122,53,255,0)"/></radialGradient></defs>
        <circle class="core" cx="240" cy="240" r="200" fill="url(#core)"/>
        <circle class="spin" cx="240" cy="240" r="234" fill="none" stroke="rgba(255,255,255,.22)" stroke-width="2" stroke-dasharray="3 12"/>
        <circle class="spin rev" cx="240" cy="240" r="208" fill="none" stroke="url(#gp)" stroke-width="7" stroke-linecap="round" stroke-dasharray="70 38" style="filter:drop-shadow(0 0 10px rgba(255,45,149,.8))"/>
        <circle class="spin fast" cx="240" cy="240" r="176" fill="none" stroke="rgba(34,229,255,.55)" stroke-width="3" stroke-dasharray="6 26"/>
        <circle cx="240" cy="240" r="150" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="2"/>
      </svg>
      <div class="inside">
        <div class="pbars"><i></i><i></i></div>
        <div class="label" id="label"></div>
      </div>
    </div>
    <div class="msg" id="msg"></div>
  </div>
  <div class="eqbig" id="eqbig"></div>

  <div class="ticker"><div class="track" id="track"></div></div>
  <div class="flash" id="flash"></div>
  <canvas id="fx" width="1920" height="1080"></canvas>
</div>
<script>
/* ================== CONFIG (edita aqui) ================== */
const CONFIG = {
  titulo: "VOLVEMOS PRONTO",
  etiqueta: "ENSEGUIDA|VOLVEMOS",   // texto dentro del anillo (| separa las lineas)
  mensajes: [
    "Hidrátate y estira las piernas",
    "Sigue a Blitz en TikTok",
    "Deja tu like mientras vuelvo",
    "Ya casi regreso, no te vayas"
  ],
  ticker: ["SIGUE A BLITZ EN TIKTOK","DEJA TU LIKE","COMPARTE EL LIVE","ACTIVA LA CAMPANITA","BIENVENIDO A LA FAMILIA BLITZ"],
  mostrarReloj: true                 // reloj con la hora actual, arriba a la derecha
};

/* ================== MOTOR COMUN (no necesitas tocar nada de aqui para abajo) ================== */
const $=id=>document.getElementById(id);
const stage=$('stage');
function fit(){const s=Math.min(innerWidth/1920,innerHeight/1080);stage.style.transform='scale('+s+')'}
addEventListener('resize',fit);fit();
const qs=new URLSearchParams(location.search);
const pad=n=>String(n).padStart(2,'0');

function letters(el,text,step,delay){
  el.textContent='';
  [...text].forEach((ch,k)=>{
    const s=document.createElement('span');s.className='ch';
    s.style.setProperty('--i',k);s.style.setProperty('--st',(step||24)+'ms');s.style.setProperty('--d',(delay||0)+'ms');
    s.textContent=ch;el.appendChild(s);
  });
}
function rotate(el,arr,sec,step){
  let n=0;const go=()=>{letters(el,arr[n%arr.length],step);n++};
  go();if(arr.length>1)setInterval(go,sec*1000);
}
function buildTicker(arr){const t=arr.map(x=>x+'<b>&#9889;</b>').join('');$('track').innerHTML=t+t+t+t}

const clk=$('clock');
if(typeof CONFIG!=='undefined'&&CONFIG.mostrarReloj===false){clk.style.display='none'}
function updClock(){clk.textContent=new Date().toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit',hour12:false})}
updClock();setInterval(updClock,1000);

function flash(){const e=$('flash');e.classList.remove('go');void e.offsetWidth;e.classList.add('go')}
function shock(x,y){const d=document.createElement('div');d.className='shock';d.style.left=x+'px';d.style.top=y+'px';stage.appendChild(d);setTimeout(()=>d.remove(),1200)}

/* ----- Rayos ----- */
const fxc=$('fx'),f=fxc.getContext('2d');
const bolts=[];
function strike(x0,y0,x1,y1){
  const pts=[[x0,y0]],n=Math.max(8,Math.floor(Math.hypot(x1-x0,y1-y0)/36));
  for(let k=1;k<n;k++){const t=k/n;pts.push([x0+(x1-x0)*t+(Math.random()-.5)*70,y0+(y1-y0)*t+(Math.random()-.5)*26])}
  pts.push([x1,y1]);
  const forks=[];
  for(let k=0;k<3;k++){
    const s=pts[2+Math.floor(Math.random()*(pts.length-4))],dir=Math.random()>.5?1:-1,fk=[[s[0],s[1]]];
    let bx=s[0],by=s[1];
    for(let j=0;j<5;j++){bx+=dir*(12+Math.random()*22);by+=10+Math.random()*26;fk.push([bx,by])}
    forks.push(fk);
  }
  bolts.push({pts,forks,life:1});
  flash();
}

/* ----- Chispas, estrellas fugaces y rayos (un solo bucle) ----- */
const c=$('sparks'),x=c.getContext('2d');
const COLS=['#ff2d95','#7a35ff','#22e5ff'];
const SPR=COLS.map(col=>{
  const s=document.createElement('canvas');s.width=s.height=64;
  const g=s.getContext('2d'),gr=g.createRadialGradient(32,32,0,32,32,32);
  gr.addColorStop(0,'#ffffffff');gr.addColorStop(.25,col+'dd');gr.addColorStop(1,col+'00');
  g.fillStyle=gr;g.fillRect(0,0,64,64);return s;
});
const P=Array.from({length:90},()=>{
  const depth=Math.random();
  return{x:Math.random()*1920,y:Math.random()*1080,s:10+depth*depth*46,v:.25+depth*1.2,d:(Math.random()-.5)*.45,
    c:Math.floor(Math.random()*3),a:.25+Math.random()*.55,ph:Math.random()*6.28,sp:.01+Math.random()*.03};
});
const S=[];
function spawnStar(){S.push({x:Math.random()*1700,y:Math.random()*420,vx:16+Math.random()*8,vy:7+Math.random()*5,life:1,c:Math.floor(Math.random()*3)})}
function tick(){
  x.globalCompositeOperation='lighter';x.clearRect(0,0,1920,1080);
  for(const p of P){
    p.y-=p.v;p.x+=p.d;p.ph+=p.sp;
    if(p.y<-60){p.y=1140;p.x=Math.random()*1920}
    x.globalAlpha=p.a*(.65+.35*Math.sin(p.ph));
    x.drawImage(SPR[p.c],p.x-p.s/2,p.y-p.s/2,p.s,p.s);
  }
  if(Math.random()<.005)spawnStar();
  for(let k=S.length-1;k>=0;k--){
    const s=S[k];s.x+=s.vx;s.y+=s.vy;s.life-=.018;
    if(s.life<=0||s.x>1980||s.y>1100){S.splice(k,1);continue}
    const tx=s.x-s.vx*9,ty=s.y-s.vy*9,gr=x.createLinearGradient(s.x,s.y,tx,ty);
    gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.3,COLS[s.c]+'cc');gr.addColorStop(1,COLS[s.c]+'00');
    x.globalAlpha=Math.min(1,s.life*1.5);x.strokeStyle=gr;x.lineWidth=3;x.lineCap='round';
    x.beginPath();x.moveTo(s.x,s.y);x.lineTo(tx,ty);x.stroke();
  }
  f.clearRect(0,0,1920,1080);
  for(let k=bolts.length-1;k>=0;k--){
    const b=bolts[k];b.life-=.03;
    if(b.life<=0){bolts.splice(k,1);continue}
    const reveal=Math.min(1,(1-b.life)*5),n=Math.max(2,Math.floor(b.pts.length*reveal)),a=Math.min(1,b.life*1.8)*(Math.random()>.15?1:.4);
    f.lineJoin='round';f.lineCap='round';
    const path=(arr,m)=>{f.beginPath();f.moveTo(arr[0][0],arr[0][1]);for(let j=1;j<(m||arr.length);j++)f.lineTo(arr[j][0],arr[j][1])};
    f.globalAlpha=a*.5;f.strokeStyle='#ff2d95';f.shadowColor='#ff2d95';f.shadowBlur=26;f.lineWidth=11;path(b.pts,n);f.stroke();
    f.globalAlpha=a;f.strokeStyle='#ffffff';f.shadowColor='#22e5ff';f.shadowBlur=16;f.lineWidth=3;path(b.pts,n);f.stroke();
    if(reveal>.5){b.forks.forEach(fk=>{f.globalAlpha=a*.8;f.lineWidth=2;path(fk);f.stroke()})}
    f.shadowBlur=0;
  }
  requestAnimationFrame(tick);
}
tick();
